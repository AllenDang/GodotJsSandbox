<?xml version="1.0"?>
<project version="1">
    <root name="."/>
    <builddir>build-cppcheck</builddir>
    <analyze-all-vs-configs>false</analyze-all-vs-configs>
    <check-headers>true</check-headers>
    <check-unused-templates>true</check-unused-templates>
    <max-ctu-depth>2</max-ctu-depth>
    <max-template-recursion>100</max-template-recursion>
    <paths>
        <dir name="src/"/>
    </paths>
    <exclude>
        <path name="godot-cpp/"/>
        <path name="quickjs/"/>
        <path name="ref/"/>
    </exclude>
    <libraries>
        <library>std</library>
    </libraries>
    <suppressions>
        <suppression>missingIncludeSystem</suppression>
        <suppression>unusedFunction</suppression>
        <suppression>syntaxError:*:*:Code 'namespace*' is invalid C code*</suppression>
        <suppression>syntaxError:*:*:Code 'using namespace*' is invalid C code*</suppression>
    </suppressions>
</project>
